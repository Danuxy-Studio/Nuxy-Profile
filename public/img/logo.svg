<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nuxyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shield/Rounded Hex -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#0f172a" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="2.5" />
  
  <!-- Dynamic Winged Rocket / Speed Chevron Logo (Danuxy Icon) -->
  <g filter="url(#neonBlur)">
    <!-- Rear Chevrons -->
    <path d="M24 35 L40 50 L24 65 L32 65 L48 50 L32 35 Z" fill="#38bdf8" fill-opacity="0.6" />
    <path d="M38 35 L54 50 L38 65 L46 65 L62 50 L46 35 Z" fill="#38bdf8" fill-opacity="0.85" />
    <!-- Main Rocket / Forward Spearhead -->
    <path d="M52 28 C64 34, 78 44, 82 50 C78 56, 64 66, 52 72 L60 50 Z" fill="url(#nuxyGlow)" />
  </g>
</svg>
